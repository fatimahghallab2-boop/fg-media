<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post | FG Media</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm custom-navbar">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">FG Media</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="profile.html" id="profile-link">Profile</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="posts.html">Explore</a>
                        </li>
                    </ul>

                    <!-- LOGGED OUT VIEW -->
                    <div id="logged-out-div" class="d-none gap-2">
                        <button class="btn btn-outline-success" type="button" data-bs-toggle="modal" data-bs-target="#login-modal" id="loginBtn">LogIn</button>
                        <button class="btn btn-outline-success" type="button" data-bs-toggle="modal" data-bs-target="#register-modal" id="registerBtn">Register</button>
                    </div>

                    <!-- LOGGED IN VIEW -->
                    <div id="logged-in-div" class="d-none align-items-center gap-2">
                        <a href="#" id="nav-user-profile-link" class="d-flex align-items-center gap-2 text-decoration-none">
                            <img id="nav-user-img" src="" width="30" height="30" class="rounded-circle" alt="user">
                            <span id="nav-user-letter" class="d-none rounded-circle align-items-center justify-content-center"></span>
                        </a>
                        <span id="nav-username"></span>
                        <button class="btn btn-outline-danger" type="button" id="logout-btn">Logout</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div id="alerts"></div>

    <!-- POST + COMMENTS -->
    <div class="container">
        <span id="postUsername"></span>
        <div id="currentPost"></div>
        <div id="comments-container"></div>

        <form id="addCommentForm">
            <input type="text" id="addComment" placeholder="Add your comment" required>
            <button type="submit" id="addCommentBtn">Send</button>
        </form>
    </div>

    <!-- Login Modal -->
    <div class="modal fade" id="login-modal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="loginModalLabel">LogIn</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="login-form">
                    <div class="modal-body">
                        <div class="input-group mb-3">
                            <span class="input-group-text">@</span>
                            <input type="text" class="form-control" id="login-username" placeholder="Username" required>
                        </div>
                        <input type="password" class="form-control" id="login-pass" placeholder="password" required>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary" id="login-btn">Login</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Register Modal -->
    <div class="modal fade" id="register-modal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="registerModalLabel">Register</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="register-form">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="register-image">Profile image</label>
                            <input type="file" class="form-control" id="register-image" accept="image/*">
                        </div>
                        <input type="text" class="form-control mb-3" id="register-name" placeholder="name" required>
                        <div class="input-group mb-3">
                            <span class="input-group-text">@</span>
                            <input type="text" class="form-control" id="register-username" placeholder="Username" required>
                        </div>
                        <input type="email" class="form-control mb-3" id="register-email" placeholder="Email" required>
                        <input type="password" class="form-control mb-3" id="register-pass" placeholder="password" required>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary" id="register-btn">Register</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Create / Edit Post Modal -->
    <div class="modal fade" id="create-post-modal" tabindex="-1" aria-labelledby="create-post-label" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 shadow">

                <div class="modal-header px-4 pt-4 border-0">
                    <div>
                        <h5 class="modal-title fw-bold" id="create-post-label">Create a Post</h5>
                        <p class="text-muted small mb-0">Every story deserves to be heard.</p>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <form id="create-form">
                    <div class="modal-body px-4">
                        <div class="mb-3">
                            <label for="postTitle" class="form-label fw-semibold">Title</label>
                            <input type="text" class="form-control" id="postTitle" placeholder="Give your post a title..." required>
                        </div>

                        <div class="mb-3">
                            <label for="post-body" class="form-label fw-semibold">What's on your mind?</label>
                            <textarea class="form-control" id="post-body" placeholder="Share your thoughts..." rows="4" required></textarea>
                        </div>

                        <div class="mb-2">
                            <label for="post-image" class="form-label fw-semibold">
                                Add an image <span class="text-muted fw-normal">(optional)</span>
                            </label>
                            <input type="file" class="form-control" id="post-image" accept="image/*">
                        </div>
                    </div>

                    <div class="modal-footer px-4 pb-4 border-0">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary px-4" id="cr-btn">
                            <span class="me-1">+</span> Create Post
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <!-- Delete Modal -->
    <div class="modal fade" id="delete-modal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteModalLabel">Delete Post?</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete this post? This action cannot be undone.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-outline-danger" id="delete-btn">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
    <script src="posts.js"></script>
</body>
</html>
